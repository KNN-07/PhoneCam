<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneCam</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <h1>PhoneCam</h1>
        <div id="status-indicator" class="status disconnected">
          <span class="status-dot"></span>
          <span class="status-text">Disconnected</span>
          <span class="fps-counter" style="display: none; margin-left: 10px;">FPS: -</span>
        </div>
      </header>

      <main class="main-content">
        <section class="settings-section">
          <h2>Settings</h2>
          <div class="settings-grid">
            <div class="setting-item">
              <label for="resolution-select">Resolution</label>
              <select id="resolution-select" class="select-field">
                <option value="640x480">480p (640x480)</option>
                <option value="1280x720">720p (1280x720)</option>
                <option value="1920x1080">1080p (1920x1080)</option>
              </select>
            </div>
            <div class="setting-item">
              <label for="fps-select">FPS</label>
              <select id="fps-select" class="select-field">
                <option value="15">15 FPS</option>
                <option value="30">30 FPS</option>
                <option value="60">60 FPS</option>
              </select>
            </div>
          </div>
        </section>

        <section class="discovery-section">
          <h2>Discovered Devices</h2>
          <div class="device-list-container">
            <ul id="device-list" class="device-list">
              <li class="device-item empty-state">Scanning for devices...</li>
            </ul>
          </div>
        </section>

        <section class="qr-connect-section">
          <h2>QR Code Fallback</h2>
          <div class="action-group" style="margin-bottom: 12px;">
            <button id="show-qr-btn" class="btn primary-btn">Show QR Code</button>
            <button id="hide-qr-btn" class="btn secondary-btn" hidden>Hide QR Code</button>
          </div>

          <div id="qr-code-panel" class="device-list-container" hidden>
            <div
              id="qr-code-image"
              style="display: flex; justify-content: center; align-items: center; margin-bottom: 12px;"
            ></div>
            <div>
              <strong>Connection URI</strong>
              <p id="qr-code-uri" style="word-break: break-all; margin: 6px 0 10px;"></p>
              <ul id="qr-code-uri-list" class="device-list" style="max-height: 110px; overflow: auto;"></ul>
            </div>
          </div>
        </section>

        <section class="manual-connect-section">
          <h2>Manual Connection</h2>
          <div class="input-group">
            <input type="text" id="ip-input" placeholder="Device IP Address" class="input-field" />
            <input type="number" id="port-input" value="7878" placeholder="Port" class="input-field port-field" />
          </div>
          <div class="action-group">
            <button id="connect-btn" class="btn primary-btn">Connect</button>
            <button id="disconnect-btn" class="btn secondary-btn" disabled>Disconnect</button>
          </div>
        </section>
      </main>
      
      <footer class="footer">
        <p>PhoneCam Desktop v0.1.0</p>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
